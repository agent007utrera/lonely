<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
overflow: hidden; /* Añade esta línea */
        }

        .game-container {
            position: relative;
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-radius: 8px;
            overflow: hidden;
        }

        .game-image {
            width: 100%;
            display: block;
        }

        /* Zonas clickeables (Hotspots) - Cambiar background a 'transparent' cuando termines de ajustar */
        .hotspot {
            position: absolute;
            background-color: rgba(255, 215, 0, 0.1); 
            border: 2px dashed rgba(255, 215, 0, 0.4);
            cursor: pointer;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .hotspot:hover {
            background-color: rgba(255, 215, 0, 0.35);
            border-color: rgba(255, 215, 0, 0.9);
        }

        /* Coordenadas personalizadas según la imagen de la biblioteca */
        #theologySection { top: -10%; left: 54%; width: 46%; height: 112%; 

            clip-path: polygon(0% 22%, 100% 0%, 100% 100%, 0% 65%);

} /* Estante central con sección de Biblias */
        



        /* Estante de la izquierda con forma de TRAPECIO EN PERSPECTIVA */
        #openBookShelf { 
            top: 0%; 
            left: 0%; 
            width: 14%; 
            height: 73%; 
            clip-path: polygon(0% 0%, 100% 25%, 100% 70%, 0% 100%);
        }

        #ladder          { top: 56%; left: 30%; width: 14%; height: 40%; } /* La escalerita de madera */
        #backShelves     { top: 20%; left: 22%; width: 12%; height: 34%; } /* Librerías del fondo del pasillo */
        #highWindow      { top: 0%; left: 39%; width: 3%;  height: 3%; } /* Ventanuco superior */

        /* Estilos del Pop-up (Modal) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background-color: #1e1e1e;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 25px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            position: relative;
            text-align: left;
        }

        .modal-content h3 {
            margin-top: 0;
            color: #d4af37;
            font-size: 1.2rem;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
text-align: center;
        }

        .modal-content p {
            line-height: 1.6;
            color: #ccc;
            font-size: 0.95rem;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.5rem;
            color: #888;
            cursor: pointer;
            background: none;
            border: none;
        }

        .close-btn:hover {
            color: #fff;
        }

        /* Estilos para el formulario del libro buscador */
        .search-container {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .search-input {
            width: 100%;
            padding: 10px;
            background-color: #2a2a2a;
            border: 1px solid #555;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        .search-btn {
            background-color: #d4af37;
            color: #121212;
            border: none;
            padding: 10px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.2s;
        }

        .search-btn:hover {
            background-color: #b89528;
        }

        .error-message {
            color: #ff6b6b;
            font-size: 0.85rem;
            margin-top: 5px;
            display: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }



.fullscreen-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            justify-content: center; align-items: center;
            cursor: pointer;
        }
        .fullscreen-overlay img {
            max-width: 90%; max-height: 90%; object-fit: contain;
            border: 2px solid #d4af37;
        }

.back-btn {
    position: fixed;
    top: 15px;
    left: 15px;
    background-color: #1e1e1e;
    color: #d4af37;
    border: 1px solid #d4af37;
    padding: 8px 12px;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: bold;
    text-decoration: none;
    border-radius: 4px;
    z-index: 1500;
    transition: background-color 0.2s, color 0.2s;
}

.back-btn:hover {
    background-color: #d4af37;
    color: #121212;
}

    </style>
</head>
<body>
<a href="#" class="back-btn" onclick="volverAlMapa(event)">VOLVER AL SALÓN</a>
    <div class="game-container">
        <!-- Imagen de fondo -->
        <img src="images/biblioteca.png" alt="Biblioteca Antigua" class="game-image">

        <!-- Zonas interactivas -->
        <div class="hotspot" id="theologySection" onclick="openTheologyModal()"></div>
        
        <div class="hotspot" id="openBookShelf" onclick="openSacredTextsModal()"></div>
        
        <div class="hotspot" id="ladder" onclick="openLadderModal()"></div>
        
        <!-- Cambiado para abrir el buscador de libros -->
        <div class="hotspot" id="backShelves" onclick="openBookSearchModal()"></div>
        
        <div class="hotspot" id="highWindow" onclick="openModal('Ventanuco Superior', 'Una rendija alta por la que apenas se filtra una pálida luz cenicienta del exterior, incapaz de disipar las sombras espesas que puebledan las altas vigas del techo.')"></div>
    </div>

    <!-- Estructura del Modal -->
    <div id="gameModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <h3 id="modalTitle">Título</h3>
            <div id="modalBody">
                <p id="modalText">Texto de la pista...</p>
            </div>
        </div>
    </div>

    <script>
        function openModal(title, text) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalBody').innerHTML = `<p id="modalText">${text}</p>`;
            document.getElementById('gameModal').style.display = 'flex';
        }

        // Función específica para abrir el pop-up de la Escalerita de Mano con sonido e imagen de la lupa
        function openLadderModal() {
            const pickupAudio = new Audio('audio/pickup.mp3');
            pickupAudio.play().catch(e => console.log("Error al reproducir audio:", e));

            const title = 'Escalerita de mano';
            const text = 'Una vieja escalera de madera portátil utilizada para alcanzar los estantes superiores. La madera cruje bajo el peso y desprende un intenso olor a humedad y encierro. Debajo de la escalerita encuentras una lupa. Introduce su código en tu Inventario "6390".';

            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalBody').innerHTML = `
                <p id="modalText">${text}</p>
                <img src="images/lupa.jpg" alt="Lupa" style="width: 100%; height: auto; margin-top: 15px; border-radius: 4px; display: block; cursor: pointer;" onclick="openFullscreenLupa()">
            `;
            document.getElementById('gameModal').style.display = 'flex';
        }

        function openFullscreenLupa() {
            document.getElementById('gameModal').style.display = 'none';
            document.getElementById('fullscreenImg').src = 'images/lupa.jpg';
            document.getElementById('fullscreenModal').style.display = 'flex';
        }

        function closeFullscreen() {
            document.getElementById('fullscreenModal').style.display = 'none';
            document.getElementById('gameModal').style.display = 'flex';
        }

        // Función específica para abrir el pop-up de la Sección de Teología con la imagen y el sonido integrados
        function openTheologyModal() {
            const title = 'Sección de Teología';
            const text = 'Una sección entera llena de Biblias y textos sagrados en diferentes idiomas. Encuentras una Biblia abierta.';
            
            // Reproduce el sonido al abrir la sección de teología
            const openBookAudio = new Audio('audio/openbook.mp3');
            openBookAudio.play().catch(e => console.log("Error al reproducir audio:", e));

            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalBody').innerHTML = `
                <p id="modalText">${text}</p>
                <img src="images/biblia.jpg" alt="Biblia" style="width: 100%; height: auto; margin-top: 15px; border-radius: 4px; display: block;">
            `;
            document.getElementById('gameModal').style.display = 'flex';
        }

        // Función para abrir el estante de textos sagrados con imagen y sonido solicitados
        function openSacredTextsModal() {
            const title = 'Estantería de Historia Local';
            const text = 'Entre los libros sobresale un papel.';
            
            const openBookAudio = new Audio('audio/openbook.mp3');
            openBookAudio.play().catch(e => console.log("Error al reproducir audio:", e));

            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalBody').innerHTML = `
                <p id="modalText">${text}</p>
                <img src="images/testamento.jpg" alt="Testamento" style="width: 100%; height: auto; margin-top: 15px; border-radius: 4px; display: block;">
            `;
            document.getElementById('gameModal').style.display = 'flex';
        }

        // Función específica para el Pasillo del Fondo con el buscador
        function openBookSearchModal() {
            document.getElementById('modalTitle').innerText = 'Pasillo del fondo';
            document.getElementById('modalBody').innerHTML = `
                <p>Un rincón oscuro al fondo de la biblioteca. Allí es donde se encuentran los hechizos.</p>
                <div class="search-container">
                    <label for="bookInput">¿Qué tomo estás buscando?</label>
                    <input type="text" id="bookInput" class="search-input" placeholder="Escribe el nombre del libro..." onkeypress="handleKeyPress(event)">
                    <button class="search-btn" onclick="buscarLibro()">Buscar</button>
                    <span id="errorMessage" class="error-message">Libro no encontrado</span>
                </div>
            `;
            document.getElementById('gameModal').style.display = 'flex';
            
            // Enfocar automáticamente el input al abrir
            setTimeout(() => {
                const input = document.getElementById('bookInput');
                if (input) input.focus();
            }, 100);
        }

        function buscarLibro() {
            const input = document.getElementById('bookInput');
            const errorMsg = document.getElementById('errorMessage');
            const valor = input.value.trim().toLowerCase();

            if (valor === 'abyssi' || valor === 'speculum') {
                errorMsg.style.display = 'none';

                const openBookAudio = new Audio('audio/openbook.mp3');
                openBookAudio.play().catch(e => console.log("Error al reproducir audio:", e));

                let bookName, targetImage, textMessage;
                if (valor === 'abyssi') {
                    bookName = 'Hechizo Abyssi';
                    targetImage = 'images/abyssi.jpg';
                    textMessage = 'Has encontrado el Hechizo Abyssi. Introduce su código en tu Inventario: "8321".';
                } else {
                    bookName = 'Hechizo Speculum';
                    targetImage = 'images/speculum.jpg';
                    textMessage = 'Has encontrado el Hechizo Speculum. Introduce su código en tu Inventario: "9456".';
                }

                document.getElementById('modalTitle').innerText = bookName;
                document.getElementById('modalBody').innerHTML = `
                    <p id="modalText">${textMessage}</p>
                    <img src="${targetImage}" alt="${bookName}" style="width: 100%; height: auto; margin-top: 15px; border-radius: 4px; display: block; cursor: pointer;" onclick="openFullscreenBook('${targetImage}')">
                `;
            } else {
                errorMsg.style.display = 'block';
                const nopeAudio = new Audio('audio/nope.mp3');
                nopeAudio.play().catch(e => console.log("Error al reproducir audio:", e));
            }
        }

        function openFullscreenBook(imageUrl) {
            document.getElementById('gameModal').style.display = 'none';
            document.getElementById('fullscreenImg').src = imageUrl;
            document.getElementById('fullscreenModal').style.display = 'flex';
        }

        // Permitir pulsar 'Enter' dentro del input
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                buscarLibro();
            }
        }

        function closeModal() {
            document.getElementById('gameModal').style.display = 'none';
        }

        // Cerrar modal si se hace clic fuera de la caja de contenido
        window.onclick = function(event) {
            let modal = document.getElementById('gameModal');
            if (event.target == modal) {
                closeModal();
            }
        }

function volverAlMapa(event) {
    event.preventDefault();
    const doorAudio = new Audio('audio/opendoor.mp3');
    doorAudio.play().catch(e => console.log("Error al reproducir audio:", e));
    doorAudio.onended = () => {
        window.location.href = 'mapa.html';
    };
    setTimeout(() => {
        window.location.href = 'mapa.html';
    }, 1500);
}

    </script>
    <div id="fullscreenModal" class="fullscreen-overlay" onclick="closeFullscreen()">
        <img id="fullscreenImg" src="" alt="Imagen a pantalla completa">
    </div>
</body>
</html>
